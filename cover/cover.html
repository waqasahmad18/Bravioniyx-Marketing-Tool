<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bravioniyx Technologies — Cover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    @page {
      size: A4 portrait;
      margin: 0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 210mm;
      height: 297mm;
      overflow: hidden;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .page {
      position: relative;
      width: 210mm;
      height: 297mm;
      background:
        radial-gradient(ellipse 90% 55% at 50% -10%, rgba(225, 6, 0, 0.22), transparent 55%),
        radial-gradient(ellipse 70% 40% at 100% 100%, rgba(225, 6, 0, 0.12), transparent 50%),
        linear-gradient(165deg, #0a0a0a 0%, #121212 45%, #080808 100%);
      color: #ffffff;
      font-family: "Outfit", sans-serif;
      overflow: hidden;
    }

    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, black 20%, transparent 75%);
      pointer-events: none;
    }

    .frame {
      position: absolute;
      inset: 14mm;
      border: 1px solid rgba(255, 255, 255, 0.12);
      pointer-events: none;
    }

    .frame::before,
    .frame::after {
      content: "";
      position: absolute;
      width: 28mm;
      height: 1.2mm;
      background: #E10600;
    }

    .frame::before {
      top: -1px;
      left: -1px;
    }

    .frame::after {
      bottom: -1px;
      right: -1px;
    }

    .corner-tr,
    .corner-bl {
      position: absolute;
      width: 28mm;
      height: 1.2mm;
      background: #E10600;
    }

    .corner-tr {
      top: -1px;
      right: -1px;
    }

    .corner-bl {
      bottom: -1px;
      left: -1px;
    }

    .top {
      position: absolute;
      top: 22mm;
      left: 0;
      right: 0;
      text-align: center;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      font-size: 9.5pt;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.55);
    }

    .center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -54%);
      width: 160mm;
      text-align: center;
    }

    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 12mm;
    }

    .logo {
      width: 48mm;
      height: auto;
      filter: drop-shadow(0 12px 28px rgba(225, 6, 0, 0.25));
    }

    .brand {
      font-family: "Syne", sans-serif;
      font-weight: 800;
      font-size: 34pt;
      line-height: 1.05;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      color: #ffffff;
    }

    .brand span {
      display: block;
      margin-top: 2mm;
      font-size: 18pt;
      font-weight: 700;
      letter-spacing: 0.28em;
      color: #E10600;
    }

    .rule {
      width: 42mm;
      height: 1.5px;
      margin: 8mm auto 7mm;
      background: linear-gradient(90deg, transparent, #E10600, transparent);
    }

    .tagline {
      font-size: 12pt;
      font-weight: 300;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.72);
    }

    .bottom {
      position: absolute;
      left: 22mm;
      right: 22mm;
      bottom: 22mm;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 8mm;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      padding-top: 6mm;
    }

    .meta {
      font-size: 8.5pt;
      font-weight: 300;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.55);
      line-height: 1.7;
    }

    .meta strong {
      display: block;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.88);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 8pt;
      margin-bottom: 1mm;
    }

    .meta a {
      color: inherit;
      text-decoration: none;
    }

    .doc-label {
      text-align: right;
      font-size: 8.5pt;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #E10600;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="grid" aria-hidden="true"></div>
    <div class="frame">
      <div class="corner-tr"></div>
      <div class="corner-bl"></div>
    </div>

    <p class="top">Company Cover</p>

    <div class="center">
      <div class="logo-wrap">
        <img class="logo" src="./logo.png" alt="Bravioniyx Technologies" />
      </div>
      <h1 class="brand">
        Bravioniyx
        <span>Technologies</span>
      </h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="tagline">Ideas / Solutions / Growth</p>
    </div>

    <footer class="bottom">
      <div class="meta">
        <strong>Contact</strong>
        Lahore, Pakistan<br />
        <a href="https://www.bravioniyx.com">www.bravioniyx.com</a><br />
        bravioniyxtecnology@gmail.com
      </div>
      <div class="doc-label">Cover Page</div>
    </footer>
  </div>
</body>
</html>
